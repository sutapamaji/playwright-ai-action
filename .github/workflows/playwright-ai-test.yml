name: 🎭 AI Functional Tests

on:
  workflow_call:
    inputs:
      # ── App ──────────────────────────────────────────────────────────────────
      start_command:
        description: "Shell command to start your app (e.g. 'npm start')"
        required: true
        type: string
      app_port:
        description: "Port your app listens on"
        required: false
        type: string
        default: "3000"
      startup_timeout_ms:
        description: "Max ms to wait for app to be ready"
        required: false
        type: string
        default: "30000"
      test_config:
        description: "Path to playwright-ai.config.json"
        required: false
        type: string
        default: "playwright-ai.config.json"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"

      # ── LLM (overridden by config file if llm block is present) ──────────────
      llm_provider:
        description: "groq | anthropic | openai | azure | custom"
        required: false
        type: string
        default: "groq"
      llm_model:
        description: "Model name / deployment name"
        required: false
        type: string
        default: ""
      llm_base_url:
        description: "Base URL — required for azure and custom providers"
        required: false
        type: string
        default: ""
      azure_api_version:
        description: "Azure API version (azure provider only)"
        required: false
        type: string
        default: "2024-02-01"

    secrets:
      # Pass whichever key matches your provider — all are optional
      GROQ_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      AZURE_OPENAI_API_KEY:
        required: false
      LLM_API_KEY:
        required: false   # Generic fallback — use this for custom providers

jobs:
  ai-functional-tests:
    name: 🤖 AI Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Download runner scripts
        run: |
          BASE="https://raw.githubusercontent.com/sutapamaji/playwright-ai-action/main/action"
          curl -sSfL "$BASE/runner.mjs"    -o .ai-runner.mjs
          curl -sSfL "$BASE/providers.mjs" -o .ai-providers.mjs
          # Make providers importable as ./providers.mjs from the runner
          sed -i 's|./providers.mjs|./.ai-providers.mjs|g' .ai-runner.mjs

      - name: Run AI functional tests
        id: run_tests
        env:
          # App
          START_COMMAND:       ${{ inputs.start_command }}
          APP_PORT:            ${{ inputs.app_port }}
          TEST_CONFIG:         ${{ inputs.test_config }}
          STARTUP_TIMEOUT_MS:  ${{ inputs.startup_timeout_ms }}
          # LLM (workflow inputs — config file overrides these at runtime)
          LLM_PROVIDER:        ${{ inputs.llm_provider }}
          MODEL:               ${{ inputs.llm_model }}
          LLM_BASE_URL:        ${{ inputs.llm_base_url }}
          AZURE_API_VERSION:   ${{ inputs.azure_api_version }}
          # API keys — pass all; runner picks the right one
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          LLM_API_KEY:         ${{ secrets.LLM_API_KEY }}
        run: node .ai-runner.mjs

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🎭 AI Functional Test Results\n\n';
            try {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const passed  = results.filter(r => r.status === 'pass').length;
              const failed  = results.filter(r => r.status === 'fail').length;

              body += failed === 0
                ? `✅ All **${passed}** tests passed\n\n`
                : `❌ **${failed} failed** · ${passed} passed\n\n`;

              body += '| Test | Status | Summary |\n|---|---|---|\n';
              for (const r of results)
                body += `| ${r.name} | ${r.status === 'pass' ? '✅' : '❌'} ${r.status} | ${r.notes ?? ''} |\n`;

              const details = results
                .filter(r => r.details)
                .map(r => `### ${r.name}\n${r.details}`)
                .join('\n\n');
              if (details)
                body += `\n<details><summary>Full analysis</summary>\n\n${details}\n</details>`;

            } catch {
              body += '⚠️ Could not read test-results.json — check Action logs.';
            }
            body += `\n\n---\n_Powered by [playwright-ai-action](https://github.com/sutapamaji/playwright-ai-action) · provider: \`${{ inputs.llm_provider }}\`_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body,
            });

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ai-results
          path: test-results.json
          if-no-files-found: ignore
