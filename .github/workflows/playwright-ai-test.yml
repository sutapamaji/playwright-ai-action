name: 🎭 AI Functional Tests

on:
  workflow_call:
    inputs:
      start_command:
        description: "Shell command to start your app (e.g. 'npm start')"
        required: true
        type: string
      app_port:
        description: "Port your app listens on"
        required: false
        type: string
        default: "3000"
      startup_timeout_ms:
        description: "Max ms to wait for app to be ready"
        required: false
        type: string
        default: "30000"
      test_config:
        description: "Path to playwright-ai.config.json"
        required: false
        type: string
        default: "playwright-ai.config.json"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      llm_provider:
        description: "groq | anthropic | openai | azure | ollama | custom"
        required: false
        type: string
        default: "groq"
      llm_model:
        description: "Model name / deployment name"
        required: false
        type: string
        default: ""
      llm_base_url:
        description: "Base URL — required for azure and custom providers"
        required: false
        type: string
        default: ""
      azure_api_version:
        description: "Azure API version (azure provider only)"
        required: false
        type: string
        default: "2024-02-01"

    secrets:
      GROQ_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      AZURE_OPENAI_API_KEY:
        required: false
      LLM_API_KEY:
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  ai-functional-tests:
    name: 🤖 AI Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout playwright-ai-action scripts
        uses: actions/checkout@v4
        with:
          repository: sutapamaji/playwright-ai-action
          path: .playwright-ai-action

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Debug secrets
        run: |
          echo "GROQ key length: ${#GROQ_API_KEY}"
          echo "LLM_PROVIDER: $LLM_PROVIDER"
          echo "Runner script exists: $(test -f .playwright-ai-action/action/runner.mjs && echo YES || echo NO)"
          echo "Providers script exists: $(test -f .playwright-ai-action/action/providers.mjs && echo YES || echo NO)"
          echo "Config exists: $(test -f playwright-ai.config.json && echo YES || echo NO)"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}

      - name: Run AI functional tests
        id: run_tests
        env:
          START_COMMAND:        ${{ inputs.start_command }}
          APP_PORT:             ${{ inputs.app_port }}
          TEST_CONFIG:          ${{ inputs.test_config }}
          STARTUP_TIMEOUT_MS:   ${{ inputs.startup_timeout_ms }}
          LLM_PROVIDER:         ${{ inputs.llm_provider }}
          MODEL:                ${{ inputs.llm_model }}
          LLM_BASE_URL:         ${{ inputs.llm_base_url }}
          AZURE_API_VERSION:    ${{ inputs.azure_api_version }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          LLM_API_KEY:          ${{ secrets.LLM_API_KEY }}
        run: node .playwright-ai-action/action/runner.mjs

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🎭 AI Functional Test Results\n\n';
            try {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const passed  = results.filter(r => r.status === 'pass').length;
              const failed  = results.filter(r => r.status === 'fail').length;
              body += failed === 0
                ? `✅ All **${passed}** tests passed\n\n`
                : `❌ **${failed} failed** · ${passed} passed\n\n`;
              body += '| Test | Status | Summary |\n|---|---|---|\n';
              for (const r of results)
                body += `| ${r.name} | ${r.status === 'pass' ? '✅' : '❌'} ${r.status} | ${r.notes ?? ''} |\n`;
              const details = results
                .filter(r => r.details)
                .map(r => `### ${r.name}\n${r.details}`)
                .join('\n\n');
              if (details)
                body += `\n<details><summary>Full analysis</summary>\n\n${details}\n</details>`;
            } catch {
              body += '⚠️ Could not read test-results.json — check Action logs.';
            }
            body += `\n\n---\n_Powered by [playwright-ai-action](https://github.com/sutapamaji/playwright-ai-action) · provider: \`${{ inputs.llm_provider }}\`_`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body,
            });

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ai-results
          path: test-results.json
          if-no-files-found: ignore
